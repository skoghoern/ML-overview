name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Require Formspree ids
        env:
          VITE_FORMSPREE_ID: ${{ secrets.VITE_FORMSPREE_ID }}
          VITE_NEWSLETTER_FORM_ID: ${{ secrets.VITE_NEWSLETTER_FORM_ID }}
        run: |
          test -n "$VITE_FORMSPREE_ID"
          test -n "$VITE_NEWSLETTER_FORM_ID"

      - run: npm test

      - run: npm run build
        env:
          VITE_FORMSPREE_ID: ${{ secrets.VITE_FORMSPREE_ID }}
          VITE_NEWSLETTER_FORM_ID: ${{ secrets.VITE_NEWSLETTER_FORM_ID }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
